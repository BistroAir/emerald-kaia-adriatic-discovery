      'bus-travel-dubrovnik': {

          { name: 'Kupari', minutes: '15–20', distance: '10 km south', lines: '10 (same line as Cavtat)', fare: 'About €2.50 one way', why: ['Abandoned Yugoslav-era resort ruins', 'Dramatic photography opportunities', 'Beautiful beach next to the ruins'], vibe: 'Atmospheric, unique, surreal.' },

          { name: 'Slano', minutes: '45–55', distance: '37 km northwest', lines: '12', fare: 'About €4.00 one way', why: ['Beautiful long bay', 'Easy walking and calm water', 'Great for a half-day scenic escape'], vibe: 'Wide bay, slow pace.' },
          { name: 'Ston', minutes: '55–65', distance: '54 km northwest', lines: '15', fare: 'About €5.00 one way', why: ['The Great Wall of Ston, a 5 km fortification', 'Famous oyster farms', 'Excellent food'], vibe: 'Historic, culinary, scenic.' },

          { name: 'Trsteno', minutes: '25–30', distance: '19 km northwest', lines: '12', fare: 'About €3.00 one way', why: ['Trsteno Arboretum, a Game of Thrones filming site', 'Ancient gardens and sea views'], vibe: 'Botanical, historic, cinematic.' }
        ],
        busSchedule: 'https://libertasdubrovnik.hr/vozni-red/',
        footerNote: 'All travel times and fares based on typical June schedules from Libertas Dubrovnik.'

    };

    const essentials = [
      ['Currency in Croatia', 'Croatia uses the Euro (since Jan 2023).'],
      ['Dubrovnik planning', 'Book Dubrovnik City Walls and Lokrum early.'],
      ['Island water taxis', 'Water taxis on Croatian islands are informal — negotiate price at the dock.'],
      ['The ship', 'Emerald Kaia is a small ship (128 guests).'],
      ['Peak season', 'Peak season (Jul–Aug): arrive early.'],
      ['Independent tours', 'Use Viator and GetYourGuide for independent tours.']
    ];

    const officialSources = {
      venice: [
        ['ACTV fares', 'https://actv.avmspa.it/en/content/prices'],
        ['ACTV waterbus timetables', 'https://avm.avmspa.it/en/content/water-bus-service-timetable-0'],
        ['St. Mark’s Basilica tickets', 'https://tickets.basilicasanmarco.it/it/negozio#/it/acquista?skugroup_id=5937'],

      ],
      rovinj: [
        ['Rovinj Tourist Board', 'https://www.rovinj-tourism.com/en'],
        ['Rovinj excursions', 'https://www.rovinj-tourism.com/en/discover/excursions']
      ],
      sibenik: [
        ['Jadrolinija line 505: schedule and 2026 fares', 'https://www.jadrolinija.hr/en/travel/sibenik_-_zlarin_-_prvic_luka_-_sepurine_-_vodice'],
        ['Jadrolinija line 532: schedule and 2026 fares', 'https://www.jadrolinija.hr/en/travel/sibenik_-_zlarin_-_obonjan_-_kaprije_-_zirje'],
        ['Krka National Park: current ticket prices', 'https://npkrka.hr/hr/posjeti/cjenik/']
      ],
      trogir: [

      ],
      vis: [

        ['Jadrolinija line 659: seasonal timetable and fares', 'https://www.jadrolinija.hr/en/travel/split_-_bol_-_hvar_-_vis_2'],
        ['Krilo live schedules and fares', 'https://krilo.hr/en/schedule']
      ],

      ],
      korcula: [

        ['Jadrolinija line 634: Orebić–Dominče timetable and 2026 fares', 'https://www.jadrolinija.hr/en/travel/orebic_-_domince_korcula'],

      ],
      dubrovnik: [
        ['Jadrolinija line 831: Dubrovnik–Lopud–Šipan schedule and fares', 'https://www.jadrolinija.hr/en/travel/dubrovnik_-_lopud_-sudjuradj_sipan'],
        ['Jadrolinija line 807: Elaphiti Islands schedule and fares', 'https://www.jadrolinija.hr/en/travel/dubrovnik_-_kolocep_-_lopud_-_sudjuradj_sipan'],
        ['Krilo Split–Dubrovnik: live schedules and fares', 'https://krilo.hr/en/destinations/dubrovnik'],
        ['Libertas current bus prices', 'https://www.libertasdubrovnik.hr/en/price-list'],
        ['Libertas city-bus timetable', 'https://www.libertasdubrovnik.hr/en/timetable/1/city-timetable']
      ],
      'bus-travel-dubrovnik': [
        ['Libertas Dubrovnik city-bus schedule', 'https://libertasdubrovnik.hr/vozni-red/'],
        ['Libertas Dubrovnik bus fares', 'https://www.libertasdubrovnik.hr/en/price-list']
      ],
      split: [
        ['Jadrolinija line 631: Split–Supetar timetable and 2026 fares', 'https://www.jadrolinija.hr/en/travel/split_-_supetar_brac'],
        ['Jadrolinija island sailing schedules', 'https://www.jadrolinija.hr/en/travels'],

      zadar: [

      ],
      'national-parks': [
        ['Krka National Park: current ticket prices', 'https://npkrka.hr/hr/posjeti/cjenik/'],
        ['Plitvice Lakes tickets and current alerts', 'https://ticketing.np-plitvicka-jezera.hr/'],
        ['Jadrolinija line 832: Prapratno–Sobra timetable and fares', 'https://www.jadrolinija.hr/en/travel/prapratno_peljesac_-_sobra_mljet'],
        ['Brijuni boat schedule from Fažana', 'https://np-brijuni.hr/en/boat-schedule-for-veliki-brijun']
      ]
    };

    officialSources.dubrovnik.push(
      ['Jadrolinija line 832: Prapratno–Sobra (Mljet)', 'https://www.jadrolinija.hr/en/travel/prapratno_peljesac_-_sobra_mljet'],
      ['Krilo seasonal route schedules', 'https://krilo.hr/en/schedule']
    );

    const nav = document.getElementById('port-nav');
    const content = document.getElementById('port-content');
    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    const mapsSearchUrl = query => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
    const placeInfoLink = (query, label = 'Place information') => `<a class="place-info-link" href="${escapeHtml(mapsSearchUrl(query))}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHtml(label)}: ${escapeHtml(query)}">ⓘ ${escapeHtml(label)}</a>`;
    const cardMarkup = ([title, detail], options = {}) => {

  let infoLink = '';

  if (options.linkPlaces) {

    const label =
      options.category === 'food'
        ? '🍽 Learn More'
        : 'ⓘ Place Information';

    infoLink = placeInfoLink(
      `${title}, ${options.location}`,
      label
    );
  }

  return `
    <li class="info-card">
      <strong>${escapeHtml(title)}</strong>
      <span>${escapeHtml(detail)}</span>
      ${infoLink}
    </li>
  `;
};
    const sectionMarkup = (title, entries, className = '', options = {}) => `<section class="content-section ${className}"><h3>${escapeHtml(title)}</h3><ul class="card-list ${className === 'basics' ? 'basics-list' : ''}">${entries.map(entry => cardMarkup(entry, options)).join('')}</ul></section>`;
    const sourceMarkup = portId => `<section class="source-section" aria-labelledby="source-title"><h3 id="source-title">Official schedules, tickets & visitor information</h3><ul class="source-list">${officialSources[portId].map(([label, url]) => `<li><a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a></li>`).join('')}</ul><p class="source-note">Official links reviewed 27 September 2026. Timetables, fares and admission details change; confirm with the operator or venue for your travel date.</p></section>`;

    function renderPort(portId, updateUrl = true) {
      const port = ports[portId];
      if (!port) return;
      if (updateUrl && new URLSearchParams(window.location.search).get('port') !== portId) {
        const url = new URL(window.location.href);
        url.searchParams.set('port', portId);
        window.history.pushState({ portId }, '', url);
      }
      document.querySelectorAll('.tab').forEach(tab => {
        const active = tab.dataset.port === portId;
        tab.setAttribute('aria-current', active ? 'page' : 'false');
      });
      const activeTab = nav.querySelector(`[data-port="${portId}"]`);
      if (activeTab) {
        const navigation = nav.closest('.navigation');
        const tabBounds = activeTab.getBoundingClientRect();
        const navigationBounds = navigation.getBoundingClientRect();
        if (tabBounds.left < navigationBounds.left || tabBounds.right > navigationBounds.right) {
          const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          activeTab.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
        }
      }
      if (port.busDestinations) {
        content.innerHTML = `
          <header class="port-heading">
            <div><p class="eyebrow">${escapeHtml(port.region)} · ${escapeHtml(port.name)}</p><h2>${escapeHtml(port.title)}</h2></div>
            <div class="port-actions"><span class="port-mark">Adriatic Discovery</span>${placeInfoLink(`${port.name}, ${port.region}`, 'View on map')}</div>
          </header>
          <p class="bus-intro">${escapeHtml(port.intro)}</p>
          <section aria-label="Bus day-trip destinations">
            <ul class="bus-destination-list">${port.busDestinations.map(destination => `
              <li class="bus-destination">
                <h3>${escapeHtml(destination.name)}</h3>
                ${placeInfoLink(`${destination.name}, near Dubrovnik, Croatia`, 'Place information')}
                <p class="bus-facts"><span><strong>Travel time:</strong> ${escapeHtml(destination.minutes)} min</span><span><strong>Distance:</strong> ${escapeHtml(destination.distance)}</span><span><strong>Bus line:</strong> ${escapeHtml(destination.lines)}</span><span><strong>Typical fare:</strong> ${escapeHtml(destination.fare)}</span></p>
                <p><strong>Official schedule:</strong> <a href="${escapeHtml(port.busSchedule)}" target="_blank" rel="noopener noreferrer">Libertas Dubrovnik</a></p>
                <p><strong>Why it’s great</strong></p>
                <ul>${destination.why.map(reason => `<li>${escapeHtml(reason)}</li>`).join('')}</ul>
                <p><strong>Vibe:</strong> ${escapeHtml(destination.vibe)}</p>
              </li>`).join('')}</ul>
            <p class="bus-footer-note">${escapeHtml(port.footerNote)}</p>
          </section>`;
        content.insertAdjacentHTML('beforeend', `<section class="essential" aria-labelledby="essential-title"><h3 id="essential-title">Essential Knowledge</h3><ul class="card-list">${essentials.map(cardMarkup).join('')}</ul></section>`);
        content.insertAdjacentHTML('beforeend', sourceMarkup(portId));
        return;
      }

      content.innerHTML = `
        <header class="port-heading">
          <div><p class="eyebrow">${escapeHtml(port.region)} · Port Guide</p><h2>${escapeHtml(port.name)}</h2><p>${escapeHtml(port.intro)}</p></div>
          <div class="port-actions"><span class="port-mark">Adriatic Discovery</span>${placeInfoLink(`${port.name}, ${port.region}`, 'View on map')}</div>
        </header>
        <div class="content-grid">
          ${sectionMarkup('Port Basics', port.basics, 'basics')}
          ${sectionMarkup('Top Things To Do', port.activities, '', { linkPlaces: true, location: `${port.name}, ${port.region}` })}
          ${sectionMarkup('Ferries & Water Transport', port.transport)}
          ${sectionMarkup(
'Local Food & Drink',
port.food,
'',
{
linkPlaces: true,
location: `${port.name}, ${port.region}`,
category: 'food'
}
)}
        </div>
        ${port.islandFerries ? sectionMarkup('Island Ferries from Dubrovnik', port.islandFerries, 'island-ferries', { linkPlaces: true, location: 'Dubrovnik, Croatia' }) : ''}
        <section class="essential" aria-labelledby="essential-title">
          <h3 id="essential-title">Essential Knowledge</h3>
          <ul class="card-list">${essentials.map(cardMarkup).join('')}</ul>
        </section>`;
      content.insertAdjacentHTML('beforeend', sourceMarkup(portId));
    }

    Object.entries(ports).forEach(([portId, port]) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'tab';
      button.dataset.port = portId;
      button.textContent = port.name;
      button.setAttribute('aria-current', 'false');
      button.addEventListener('click', () => renderPort(portId));
      nav.append(button);
    });

    function renderPortFromUrl() {
      const requestedPort = new URLSearchParams(window.location.search).get('port');
      renderPort(ports[requestedPort] ? requestedPort : 'venice', false);
    }

    window.addEventListener('popstate', renderPortFromUrl);
    const initialPort = new URLSearchParams(window.location.search).get('port');
    if (initialPort && ports[initialPort]) {
      renderPort(initialPort, false);
    } else {
      renderPort('venice', false);
      const url = new URL(window.location.href);
      url.searchParams.set('port', 'venice');
      window.history.replaceState({ portId: 'venice' }, '', url);
    }
  </script>
